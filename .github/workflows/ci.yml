name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install ruff
        run: python -m pip install --upgrade pip ruff
      - name: Run ruff
        run: python -m ruff check src tests

  version-consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Check pyproject and package versions match
        run: |
          python - <<'EOF'
          import re, sys, tomllib
          with open("pyproject.toml", "rb") as f:
              proj = tomllib.load(f)["project"]["version"]
          src = open("src/worsaga/__init__.py", encoding="utf-8").read()
          pkg = re.search(r'__version__\s*=\s*"([^"]+)"', src).group(1)
          if proj != pkg:
              sys.exit(f"version mismatch: pyproject={proj} __init__={pkg}")
          print(f"version OK: {proj}")
          EOF

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install build tooling
        run: python -m pip install --upgrade pip build
      - name: Public release audit (tracked files + built artifacts)
        run: bash scripts/audit_public_release.sh

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.12", "3.14"]
        include:
          - os: macos-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package with dev extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,mcp,yaml]"
      - name: Run pytest
        run: python -m pytest -q

  mcp-compat:
    # mcp 2.0 dropped mcp.server.fastmcp, which the MCP server imports, so
    # the extra is pinned to >=1.28,<2. Test both ends of that window: the
    # declared floor and whatever the range currently resolves to.
    strategy:
      fail-fast: false
      matrix:
        mcp-spec: ["mcp==1.28.*", "mcp>=1.28,<2"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install package with the selected mcp release
        # One resolve, so the floor job also gets the transitive
        # dependencies mcp 1.28 asks for rather than a newer release's.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,mcp,yaml]" "${{ matrix.mcp-spec }}"
      - name: Report resolved mcp version
        run: |
          python -c "from importlib.metadata import version; print('mcp', version('mcp'))"
      - name: Run pytest
        run: python -m pytest -q

  package-smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            venv-bin: bin
          - os: macos-latest
            venv-bin: bin
          - os: windows-latest
            venv-bin: Scripts
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Smoke-test wheel install
        shell: bash
        run: |
          python -m venv test-wheel
          test-wheel/${{ matrix.venv-bin }}/pip install dist/*.whl
          test-wheel/${{ matrix.venv-bin }}/worsaga --help
          test-wheel/${{ matrix.venv-bin }}/python -m worsaga.cli --help
          test-wheel/${{ matrix.venv-bin }}/worsaga config --json
      - name: Smoke-test sdist install
        shell: bash
        run: |
          python -m venv test-sdist
          test-sdist/${{ matrix.venv-bin }}/pip install dist/*.tar.gz
          test-sdist/${{ matrix.venv-bin }}/worsaga --help
          test-sdist/${{ matrix.venv-bin }}/python -m worsaga.cli --help
          test-sdist/${{ matrix.venv-bin }}/worsaga config --json
