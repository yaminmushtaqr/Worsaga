name: Publish to PyPI

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install --upgrade pip build twine

      - name: Public release audit (tracked files + built artifacts)
        run: bash scripts/audit_public_release.sh

      - name: Run tests
        run: |
          python -m pip install -e ".[dev,mcp,yaml]"
          python -m pytest -q

      - name: Build
        run: python -m build

      - name: Check package metadata
        run: python -m twine check dist/*

      - name: Publish package
        uses: pypa/gh-action-pypi-publish@release/v1
