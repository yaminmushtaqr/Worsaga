name: Publish to PyPI

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      # Third-party actions are pinned to full commit SHAs (the tag in the
      # comment is informational): tags are mutable and could be repointed
      # at malicious code.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Verify tag matches package version
        if: github.ref_type == 'tag'
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [ "$tag_version" != "$package_version" ]; then
            echo "Tag v$tag_version does not match pyproject version $package_version" >&2
            exit 1
          fi

      - name: Install build tools
        run: python -m pip install --upgrade pip build twine

      - name: Public release audit (tracked files + built artifacts)
        run: bash scripts/audit_public_release.sh

      - name: Run tests
        run: |
          python -m pip install -e ".[dev,mcp,yaml]"
          python -m pytest -q

      - name: Build
        run: python -m build

      - name: Check package metadata
        run: python -m twine check dist/*

      # Publishing only happens from a version-verified tag push;
      # workflow_dispatch runs everything above as a dry run.
      - name: Publish package
        if: github.ref_type == 'tag'
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # v1.14.1
